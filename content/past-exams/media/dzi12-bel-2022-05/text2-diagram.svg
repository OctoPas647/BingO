<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 610" width="440" height="610" font-family="Times New Roman, serif"><rect width="440" height="610" fill="#fff"/><text x="220.0" y="24" font-size="19" font-weight="700" text-anchor="middle">Зависимост между резултатите по</text><text x="220.0" y="48" font-size="19" font-weight="700" text-anchor="middle">четивна грамотност в точки (от 340</text><text x="220.0" y="72" font-size="19" font-weight="700" text-anchor="middle">до 480) и четенето на различни</text><text x="220.0" y="96" font-size="19" font-weight="700" text-anchor="middle">текстове според изследването PISA</text><text x="220.0" y="120" font-size="19" font-weight="700" text-anchor="middle">през 2018 г.</text><rect x="12" y="136" width="22" height="16" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="42" y="150" font-size="17">Четат няколко пъти на седмица</text><rect x="12" y="160" width="22" height="16" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="42" y="174" font-size="17">Не четат</text><line x1="12.0" x2="12.0" y1="192" y2="582" stroke="#000" stroke-opacity=".13"/><text x="12.0" y="600" font-size="14" text-anchor="middle" fill="#444">340</text><line x1="121.7" x2="121.7" y1="192" y2="582" stroke="#000" stroke-opacity=".13"/><text x="121.7" y="600" font-size="14" text-anchor="middle" fill="#444">380</text><line x1="231.4" x2="231.4" y1="192" y2="582" stroke="#000" stroke-opacity=".13"/><text x="231.4" y="600" font-size="14" text-anchor="middle" fill="#444">420</text><line x1="341.1" x2="341.1" y1="192" y2="582" stroke="#000" stroke-opacity=".13"/><text x="341.1" y="600" font-size="14" text-anchor="middle" fill="#444">460</text><text x="12" y="212" font-size="17" font-weight="700">Текстове от художествена литература</text><rect x="12" y="220" width="334.6" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="352.6" y="235" font-size="16">462</text><rect x="12" y="241" width="139.9" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="157.9" y="256" font-size="16">391</text><text x="12" y="292" font-size="17" font-weight="700">Текстове от документална литература</text><rect x="12" y="300" width="290.7" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="308.7" y="315" font-size="16">446</text><rect x="12" y="321" width="200.2" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="218.2" y="336" font-size="16">413</text><text x="12" y="372" font-size="17" font-weight="700">Текстове от списания</text><rect x="12" y="380" width="167.3" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="185.3" y="395" font-size="16">401</text><rect x="12" y="401" width="213.9" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="231.9" y="416" font-size="16">418</text><text x="12" y="452" font-size="17" font-weight="700">Текстове от вестници</text><rect x="12" y="460" width="98.7" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="116.7" y="475" font-size="16">376</text><rect x="12" y="481" width="266.1" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="284.1" y="496" font-size="16">437</text><text x="12" y="532" font-size="17" font-weight="700">Комикси</text><rect x="12" y="540" width="197.5" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="215.5" y="555" font-size="16">412</text><rect x="12" y="561" width="279.8" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="297.8" y="576" font-size="16">442</text></svg>
