<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 744" width="440" height="744" font-family="Times New Roman, serif"><rect width="440" height="744" fill="#fff"/><text x="220.0" y="24" font-size="19" font-weight="700" text-anchor="middle">Вие лично защо не спортувате?</text><rect x="12" y="40" width="22" height="16" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="42" y="54" font-size="17">над 50 години</text><rect x="12" y="64" width="22" height="16" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="42" y="78" font-size="17">между 31 и 50 години</text><rect x="12" y="88" width="22" height="16" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="42" y="102" font-size="17">между 16 и 30 години</text><line x1="12.0" x2="12.0" y1="120" y2="716" stroke="#000" stroke-opacity=".13"/><text x="12.0" y="734" font-size="14" text-anchor="middle" fill="#444">0</text><line x1="121.7" x2="121.7" y1="120" y2="716" stroke="#000" stroke-opacity=".13"/><text x="121.7" y="734" font-size="14" text-anchor="middle" fill="#444">20</text><line x1="231.4" x2="231.4" y1="120" y2="716" stroke="#000" stroke-opacity=".13"/><text x="231.4" y="734" font-size="14" text-anchor="middle" fill="#444">40</text><line x1="341.1" x2="341.1" y1="120" y2="716" stroke="#000" stroke-opacity=".13"/><text x="341.1" y="734" font-size="14" text-anchor="middle" fill="#444">60</text><text x="12" y="140" font-size="17" font-weight="700">Няма къде да спортувам</text><rect x="12" y="148" width="329.1" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="347.1" y="163" font-size="16">60%</text><rect x="12" y="169" width="109.7" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="127.7" y="184" font-size="16">20%</text><rect x="12" y="190" width="109.7" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="127.7" y="205" font-size="16">20%</text><text x="12" y="241" font-size="17" font-weight="700">Нямам достатъчно финансови средства</text><rect x