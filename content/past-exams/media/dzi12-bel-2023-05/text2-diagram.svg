<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 755" width="440" height="755" font-family="Times New Roman, serif"><rect width="440" height="755" fill="#fff"/><text x="220.0" y="24" font-size="19" font-weight="700" text-anchor="middle">Данни (в %) от анкета за мястото</text><text x="220.0" y="48" font-size="19" font-weight="700" text-anchor="middle">на изкуствата в обучението</text><rect x="12" y="64" width="22" height="16" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="42" y="78" font-size="17">Съгласен съм</text><rect x="12" y="88" width="22" height="16" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="42" y="102" font-size="17">Не съм съгласен</text><rect x="12" y="112" width="22" height="16" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="42" y="126" font-size="17">Нямам мнение</text><line x1="12.0" x2="12.0" y1="144" y2="727" stroke="#000" stroke-opacity=".13"/><text x="12.0" y="745" font-size="14" text-anchor="middle" fill="#444">0</text><line x1="121.7" x2="121.7" y1="144" y2="727" stroke="#000" stroke-opacity=".13"/><text x="121.7" y="745" font-size="14" text-anchor="middle" fill="#444">20</text><line x1="231.4" x2="231.4" y1="144" y2="727" stroke="#000" stroke-opacity=".13"/><text x="231.4" y="745" font-size="14" text-anchor="middle" fill="#444">40</text><line x1="341.1" x2="341.1" y1="144" y2="727" stroke="#000" stroke-opacity=".13"/><text x="341.1" y="745" font-size="14" text-anchor="middle" fill="#444">60</text><text x="12" y="164" font-size="17" font-weight="700">1. Учениците имат достатъчен досег до</text><text x="12" y="185" font-size="17" font-weight="700">изкуството (изобразително изкуство, музика,</text><text x="12" y="206" font-size="17" font-weight="700">театър, танци) през учебните програми.</text><rect x="12" y="214" width="312.7" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="330.7" y="229" font-size="16">57</text><rect x="12" y="235" width="230.4" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="248.4" y="250" font-size="16">42</text><rect x="12" y="256" width="5.5" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="23.5" y="271" font-size="16">1</text><text x="12" y="307" font-size="17" font-weight="700">2. Училището предоставя допълнителни</text><text x="12" y="328" font-size="17" font-weight="700">възможности на учениците да се занимават с</text><text x="12" y="349" font-size="17" font-weight="700">изобразително или сценично изкуство</text><text x="12" y="370" font-size="17" font-weight="700">(например извънкласни дейности).</text><rect x="12" y="378" width="329.1" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="347.1" y="393" font-size="16">60</text><rect x="12" y="399" width="208.5" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="226.5" y="414" font-size="16">38</text><rect x="12" y="420" width="11.0" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="29.0" y="435" font-size="16">2</text><text x="12" y="471" font-size="17" font-weight="700">3. Училището често работи с гостуващи</text><text x="12" y="492" font-size="17" font-weight="700">художници или си сътрудничи с художествени</text><text x="12" y="513" font-size="17" font-weight="700">организации.</text><rect x="12" y="521" width="257.8" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="275.8" y="536" font-size="16">47</text><rect x="12" y="542" width="268.8" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="286.8" y="557" font-size="16">49</text><rect x="12" y="563" width="21.9" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="39.9" y="578" font-size="16">4</text><text x="12" y="614" font-size="17" font-weight="700">4. Художественото образование не е чак такъв</text><text x="12" y="635" font-size="17" font-weight="700">приоритет (в сравнение с природните науки, с</text><text x="12" y="656" font-size="17" font-weight="700">ИКТ или със спорта).</text><rect x="12" y="664" width="329.1" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="347.1" y="679" font-size="16">60</text><rect x="12" y="685" width="213.9" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="231.9" y="700" font-size="16">39</text><rect x="12" y="706" width="5.5" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="23.5" y="721" font-size="16">1</text></svg>
