<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 567" width="440" height="567" font-family="Times New Roman, serif"><rect width="440" height="567" fill="#fff"/><text x="220.0" y="24" font-size="19" font-weight="700" text-anchor="middle">Отговорите на 1285 души на въпроса</text><text x="220.0" y="45" font-size="16" text-anchor="middle">Как да се постъпи с мобилните телефони на</text><text x="220.0" y="66" font-size="16" text-anchor="middle">учениците в час?</text><line x1="12.0" x2="12.0" y1="90" y2="539" stroke="#000" stroke-opacity=".13"/><text x="12.0" y="557" font-size="14" text-anchor="middle" fill="#444">0</text><line x1="88.8" x2="88.8" y1="90" y2="539" stroke="#000" stroke-opacity=".13"/><text x="88.8" y="557" font-size="14" text-anchor="middle" fill="#444">10</text><line x1="165.6" x2="165.6" y1="90" y2="539" stroke="#000" stroke-opacity=".13"/><text x="165.6" y="557" font-size="14" text-anchor="middle" fill="#444">20</text><line x1="242.4" x2="242.4" y1="90" y2="539" stroke="#000" stroke-opacity=".13"/><text x="242.4" y="557" font-size="14" text-anchor="middle" fill="#444">30</text><line x1="319.2" x2="319.2" y1="90" y2="539" stroke="#000" stroke-opacity=".13"/><text x="319.2" y="557" font-size="14" text-anchor="middle" fill="#444">40</text><line x1="396.0" x2="396.0" y1="90" y2="539" stroke="#000" stroke-opacity=".13"/><text x="396.0" y="557" font-size="14" text-anchor="middle" fill="#444">50</text><text x="12" y="110" font-size="17" font-weight="700">По-строго – да се забрани използването им в</text><text x="12" y="131" font-size="17" font-weight="700">училище.</text><rect x="12" y="139" width="365.6" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="383.6" y="154" font-size="16">47.6%</text><text x="12" y="190" font-size="17" font-weight="700">Както досега – учениците да нямат право да</text><text x="12" y="211" font-size="17" font-weight="700">ги използват в час.</text><rect x="12" y="219" width="299.5" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="317.5" y="234" font-size="16">39.0%</text><text x="12" y="270" font-size="17" font-weight="700">Да се разреши използването им в час, но само</text><text x="12" y="291" font-size="17" font-weight="700">за образователни цели.</text><rect x="12" y="299" width="41.5" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="59.5" y="314" font-size="16">5.4%</text><text x="12" y="350" font-size="17" font-weight="700">Всяко училище само̀ да решава какъв режим на</text><text x="12" y="371" font-size="17" font-weight="700">използване да приложи.</text><rect x="12" y="379" width="30.7" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="48.7" y="394" font-size="16">4.0%</text><text x="12" y="430" font-size="17" font-weight="700">Все ми е едно. / Не ме интересува.</text><rect x="12" y="438" width="16.9" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="34.9" y="453" font-size="16">2.2%</text><text x="12" y="489" font-size="17" font-weight="700">Ползването им в час да се забрани са̀мо за</text><text x="12" y="510" font-size="17" font-weight="700">учениците до 4. клас.</text><rect x="12" y="518" width="13.8" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="31.8" y="533" font-size="16">1.8%</text></svg>
