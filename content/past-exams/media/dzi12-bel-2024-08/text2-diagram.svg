<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 938" width="440" height="938" font-family="Times New Roman, serif"><rect width="440" height="938" fill="#fff"/><text x="220.0" y="24" font-size="19" font-weight="700" text-anchor="middle">Какво бихте предприели в</text><text x="220.0" y="48" font-size="19" font-weight="700" text-anchor="middle">ежедневието си, за да се намалят</text><text x="220.0" y="72" font-size="19" font-weight="700" text-anchor="middle">неблагоприятните промени в</text><text x="220.0" y="96" font-size="19" font-weight="700" text-anchor="middle">климата?</text><rect x="12" y="112" width="22" height="16" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="42" y="126" font-size="17">Съгласен съм</text><rect x="12" y="136" width="22" height="16" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="42" y="150" font-size="17">Не съм съгласен</text><rect x="12" y="160" width="22" height="16" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="42" y="174" font-size="17">Не мога да преценя</text><line x1="12.0" x2="12.0" y1="192" y2="910" stroke="#000" stroke-opacity=".13"/><text x="12.0" y="928" font-size="14" text-anchor="middle" fill="#444">0</text><line x1="108.0" x2="108.0" y1="192" y2="910" stroke="#000" stroke-opacity=".13"/><text x="108.0" y="928" font-size="14" text-anchor="middle" fill="#444">20</text><line x1="204.0" x2="204.0" y1="192" y2="910" stroke="#000" stroke-opacity=".13"/><text x="204.0" y="928" font-size="14" text-anchor="middle" fill="#444">40</text><line x1="300.0" x2="300.0" y1="192" y2="910" stroke="#000" stroke-opacity=".13"/><text x="300.0" y="928" font-size="14" text-anchor="middle" fill="#444">60</text><line x1="396.0" x2="396.0" y1="192" y2="910" stroke="#000" stroke-opacity=".13"/><text x="396.0" y="928" font-size="14" text-anchor="middle" fill="#444">80</text><text x="12" y="212" font-size="17" font-weight="700">Да пътувам по-малко със самолет.</text><rect x="12" y="220" width="120.0" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="138.0" y="235" font-size="16">25%</text><rect x="12" y="241" width="336.0" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="354.0" y="256" font-size="16">70%</text><rect x="12" y="262" width="24.0" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="42.0" y="277" font-size="16">5%</text><text x="12" y="313" font-size="17" font-weight="700">Да пътувам по-малко с автомобил.</text><rect x="12" y="321" width="144.0" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="162.0" y="336" font-size="16">30%</text><rect x="12" y="342" width="312.0" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="330.0" y="357" font-size="16">65%</text><rect x="12" y="363" width="24.0" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="42.0" y="378" font-size="16">5%</text><text x="12" y="414" font-size="17" font-weight="700">Да пестя повече вода.</text><rect x="12" y="422" width="240.0" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="258.0" y="437" font-size="16">50%</text><rect x="12" y="443" width="192.0" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="210.0" y="458" font-size="16">40%</text><rect x="12" y="464" width="48.0" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="66.0" y="479" font-size="16">10%</text><text x="12" y="515" font-size="17" font-weight="700">Да купувам енергоефективни електроуреди.</text><rect x="12" y="523" width="144.0" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="162.0" y="538" font-size="16">30%</text><rect x="12" y="544" width="288.0" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="306.0" y="559" font-size="16">60%</text><rect x="12" y="565" width="48.0" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="66.0" y="580" font-size="16">10%</text><text x="12" y="616" font-size="17" font-weight="700">Да купувам по-малко стоки в пластмасови</text><text x="12" y="637" font-size="17" font-weight="700">опаковки.</text><rect x="12" y="645" width="240.0" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="258.0" y="660" font-size="16">50%</text><rect x="12" y="666" width="168.0" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="186.0" y="681" font-size="16">35%</text><rect x="12" y="687" width="72.0" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="90.0" y="702" font-size="16">15%</text><text x="12" y="738" font-size="17" font-weight="700">Да купувам повече местни и сезонни продукти.</text><rect x="12" y="746" width="297.6" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="315.6" y="761" font-size="16">62%</text><rect x="12" y="767" width="144.0" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="162.0" y="782" font-size="16">30%</text><rect x="12" y="788" width="38.4" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="56.4" y="803" font-size="16">8%</text><text x="12" y="839" font-size="17" font-weight="700">Да изхвърлям отпадъците си разделно.</text><rect x="12" y="847" width="360.0" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="378.0" y="862" font-size="16">75%</text><rect x="12" y="868" width="96.0" height="18" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="114.0" y="883" font-size="16">20%</text><rect x="12" y="889" width="24.0" height="18" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="42.0" y="904" font-size="16">5%</text></svg>
