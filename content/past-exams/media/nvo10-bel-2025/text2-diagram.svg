<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 591" width="440" height="591" font-family="Times New Roman, serif"><rect width="440" height="591" fill="#fff"/><text x="220.0" y="24" font-size="19" font-weight="700" text-anchor="middle">Мнения на родители за ползите от</text><text x="220.0" y="48" font-size="19" font-weight="700" text-anchor="middle">джобните пари в брой</text><line x1="12.0" x2="12.0" y1="72" y2="563" stroke="#000" stroke-opacity=".13"/><text x="12.0" y="581" font-size="14" text-anchor="middle" fill="#444">0</text><line x1="76.0" x2="76.0" y1="72" y2="563" stroke="#000" stroke-opacity=".13"/><text x="76.0" y="581" font-size="14" text-anchor="middle" fill="#444">10</text><line x1="140.0" x2="140.0" y1="72" y2="563" stroke="#000" stroke-opacity=".13"/><text x="140.0" y="581" font-size="14" text-anchor="middle" fill="#444">20</text><line x1="204.0" x2="204.0" y1="72" y2="563" stroke="#000" stroke-opacity=".13"/><text x="204.0" y="581" font-size="14" text-anchor="middle" fill="#444">30</text><line x1="268.0" x2="268.0" y1="72" y2="563" stroke="#000" stroke-opacity=".13"/><text x="268.0" y="581" font-size="14" text-anchor="middle" fill="#444">40</text><line x1="332.0" x2="332.0" y1="72" y2="563" stroke="#000" stroke-opacity=".13"/><text x="332.0" y="581" font-size="14" text-anchor="middle" fill="#444">50</text><line x1="396.0" x2="396.0" y1="72" y2="563" stroke="#000" stroke-opacity=".13"/><text x="396.0" y="581" font-size="14" text-anchor="middle" fill="#444">60</text><text x="12" y="92" font-size="17" font-weight="700">Когато разполага с пари в брой, детето</text><text x="12" y="113" font-size="17" font-weight="700">по-добре планира разходите си.</text><rect x="12" y="121" width="89.6" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="107.6" y="136" font-size="16">14%</text><text x="12" y="172" font-size="17" font-weight="700">Когато плаща с пари в брой, детето по-бързо</text><text x="12" y="193" font-size="17" font-weight="700">се учи да пресмята стойността на покупките.</text><rect x="12" y="201" width="70.4" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="88.4" y="216" font-size="16">11%</text><text x="12" y="252" font-size="17" font-weight="700">Ако загуби парите си, детето ще се научи да</text><text x="12" y="273" font-size="17" font-weight="700">внимава повече.</text><rect x="12" y="281" width="32.0" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="50.0" y="296" font-size="16">5%</text><text x="12" y="332" font-size="17" font-weight="700">Когато борави с пари в брой в чужбина,</text><text x="12" y="353" font-size="17" font-weight="700">детето се запознава с различни монети и</text><text x="12" y="374" font-size="17" font-weight="700">банкноти и с изображенията върху тях.</text><rect x="12" y="382" width="19.2" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="37.2" y="397" font-size="16">3%</text><text x="12" y="433" font-size="17" font-weight="700">Ако събира пари в касичка, детето е</text><text x="12" y="454" font-size="17" font-weight="700">по-мотивирано да спестява.</text><rect x="12" y="462" width="44.8" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="62.8" y="477" font-size="16">7%</text><text x="12" y="513" font-size="17" font-weight="700">По-полезно и разумно е детето да получава</text><text x="12" y="534" font-size="17" font-weight="700">парите си в дебитна карта, отколкото в брой.</text><rect x="12" y="542" width="384.0" height="18" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="402.0" y="557" font-size="16">60%</text></svg>
