<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 911" width="440" height="911" font-family="Times New Roman, serif"><rect width="440" height="911" fill="#fff"/><text x="220.0" y="24" font-size="19" font-weight="700" text-anchor="middle">За какво най-често се използват</text><text x="220.0" y="48" font-size="19" font-weight="700" text-anchor="middle">платформите за видеосподеляне</text><text x="220.0" y="69" font-size="16" text-anchor="middle">(Онлайн проучване сред младежи на възраст от</text><text x="220.0" y="90" font-size="16" text-anchor="middle">14 до 19 г. с данни в %)</text><rect x="12" y="106" width="22" height="16" fill="#2b2b2b" stroke="#000" stroke-width=".7"/><text x="42" y="120" font-size="17">Съгласен съм</text><rect x="12" y="130" width="22" height="16" fill="#8c8c8c" stroke="#000" stroke-width=".7"/><text x="42" y="144" font-size="17">Не съм съгласен</text><rect x="12" y="154" width="22" height="16" fill="#d0d0d0" stroke="#000" stroke-width=".7"/><text x="42" y="168" font-size="17">Не мога да преценя</text><line x1="12.0" x2="12.0" y1="186" y2="883" stroke="#000" stroke-opacity=".13"/><text x="12.0" y="901" font-size="14" text-anchor="middle" fill="#444">0</text><line x1="97.3" x2="97.3" y1="186" y2="883" stroke="#000" stroke-opacity=".13"/><text x="97.3" y="901" font-size="14" text-anchor="middle" fill="#444">20</text><line x1="182.7" x2="182.7" y1="186" y2="883" stroke="#000" stroke-opacity=".13"/><text x="182.7" y="901" font-size="14" text-anchor="middle" fill="#444">40</text><line x1="268.0" x2="268.0" y1="186" y2="883" stroke="#000" stroke-opacity=".13"/><text x="268.0" y="901" font-size="14" text-anchor="middle" fill="#444">60</text><line x1="353.3" x2="353.3" y1="186" y2="883" stroke="#000" stroke-opacity=".13"/><text x="353.3" y="901" font-size="14" text-anchor="middle" fill="#444">80</text><text x="12" y="206" font-size="17" font-weight="700">За забавление</text><rect x="12" y="214" width="341.3" height="18" fill="#2b2b2b" stroke="#0