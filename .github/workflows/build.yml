# Checks BingO, builds the APK (with Gradle, 0.6.0) and the web page on every push to main.
# With the BINGO_AI_SERVER variable set (Settings → Secrets and variables → Actions → Variables), the app talks to
# BingO's AI server on Cloud Run; no Gemini key is ever put into the app or the web page.
# With the BINGO_SIGNING secret set (see README.md, "Signing"), each build is signed with your key
# and published as a GitHub Release with the APK and the module files. Without it, the build still
# runs and a test APK can be downloaded from the run's Artifacts, but nothing is published.
# With the FTP_HOST / FTP_USER / FTP_PASSWORD secrets set (see README.md, "Website"), the web page is also
# uploaded to the website, e.g. https://preotkrivanegk.com/bingo/.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'data/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android SDK platform and build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Check
        run: python3 tools/build.py check

      - name: Restore signing key
        id: key
        env:
          SIGNING: ${{ secrets.BINGO_SIGNING }}
        run: |
          if [ -n "$SIGNING" ]; then
            mkdir -p platforms/android/signing
            echo "$SIGNING" | base64 -d > /tmp/signing.zip
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/signing.zip').extractall('platforms/android/signing')"
            rm /tmp/signing.zip
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No BINGO_SIGNING secret: building a test APK with a temporary key. It won't install over the app on your phone, and no release is published."
          fi

      - name: Build APK (Gradle, with Gemini Nano) and web page
        env:
          # the address of BingO's AI server on Cloud Run (server/README.md); the Gemini key itself stays on the server
          BINGO_AI_SERVER: ${{ vars.BINGO_AI_SERVER || secrets.BINGO_AI_SERVER }}
          # BingO for classes: the Firebase web config as JSON (docs/firebase.md); without it the class features say "not connected"
          BINGO_FIREBASE: ${{ vars.BINGO_FIREBASE }}
          # Google Play Integrity for class tests: the Cloud project number linked in Play Console (docs/test-security.md)
          BINGO_PLAY_PROJECT: ${{ vars.BINGO_PLAY_PROJECT }}
        run: |
          chmod +x platforms/android/gradlew
          python3 tools/build.py android
          python3 tools/build.py web

      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import json; print(json.load(open('tools/config.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Upload to this run
        uses: actions/upload-artifact@v4
        with:
          name: BingO-${{ steps.ver.outputs.version }}${{ steps.key.outputs.signed == 'true' && '' || '-test-key' }}
          path: |
            dist/android/*.apk
            dist/web/index.html
            dist/web/bingo-push-sw.js

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VER"
          python3 - <<'PY' > notes.md
          import os, re
          ver = os.environ['VER']
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(ver) + r'.*?\n(.*?)(?=^## |\Z)', text, re.S | re.M)
          print((m.group(1).strip() if m else 'BingO ' + ver) + '\n\nInstall the APK on your phone.')
          PY
          FILES="dist/android/*.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" $FILES --title "BingO $VER" --notes-file notes.md --target "$GITHUB_SHA"
          fi

      - name: Put the web page on the website
        if: github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::No FTP_HOST / FTP_USER / FTP_PASSWORD secrets: the web page is not uploaded to the website."
            exit 0
          fi
          DIR="${FTP_DIR#/}"; DIR="${DIR%/}"
          # The FTP server's certificate must be issued for the host we connect to (curl exit 60 otherwise).
          # On shared hosting (cPanel) it is often issued for the server's own name or the bare domain, not
          # ftp.<domain>. Read the names on the certificate and connect to one of them; verification stays on.
          NAMES=$(timeout 20 openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" </dev/null 2>/dev/null \
            | openssl x509 -noout -ext subjectAltName -subject 2>/dev/null | grep -oE '(DNS:|CN ?= ?)[^,[:space:]]+' | sed -E 's/^(DNS:|CN ?= ?)//' | sort -u)
          HOST=$(FTP_HOST="$FTP_HOST" NAMES="$NAMES" python3 - <<'PY'
          import os, fnmatch
          h, names = os.environ['FTP_HOST'].lower(), [n.lower() for n in os.environ['NAMES'].split()]
          ok = lambda n: n == h or (n.startswith('*.') and fnmatch.fnmatch(h, n) and h.count('.') == n.count('.'))
          if not names or any(ok(n) for n in names): print(h)
          else:
              # a name on the certificate that exists in DNS: the same domain first (preotkrivanegk.com for ftp.preotkrivanegk.com),
              # then the hosting server's own name, the shortest one (web.example.com, not autoconfig.web.example.com)
              import socket
              def resolves(n):
                  try: socket.gethostbyname(n); return True
                  except OSError: return False
              base = '.'.join(h.split('.')[-2:])
              real = sorted((n for n in names if not n.startswith('*')), key=lambda n: (not n.endswith(base), n.count('.'), len(n)))
              print(next((n for n in real if resolves(n)), h))
          PY
          )
          if [ "$HOST" != "$(echo "$FTP_HOST" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::warning::The FTP server's certificate is not issued for FTP_HOST. Using '$HOST' from the certificate instead. Set the FTP_HOST secret to '$HOST' to silence this."
          fi
          echo "Certificate names: $(echo $NAMES)"
          # Without FTP_DIR, find where the account starts:
          #  - above the site (public_html is listed)          -> public_html/bingo
          #  - in the site's root (WordPress files are listed)  -> bingo
          #  - already in the BingO folder (README: Directory public_html/bingo) -> the top folder itself.
          # (1.0.0-1.0.1 always added bingo/ here, so the builds landed in public_html/bingo/bingo and
          # preotkrivanegk.com/bingo/ stayed on 0.8.0.)
          LIST=$(curl --silent --ssl-reqd --list-only --user "$FTP_USER:$FTP_PASSWORD" "ftp://$HOST/" | tr -d '\r' || true)
          echo "FTP top folder: $(echo $LIST)"
          if [ -z "$DIR" ]; then
            if echo "$LIST" | grep -qx "public_html"; then DIR="public_html/bingo"
            elif echo "$LIST" | grep -qxE "wp-config\.php|wp-content|wp-admin"; then DIR="bingo"
            else DIR=""; fi
            echo "::notice::FTP_DIR is not set: uploading to ${DIR:-the top folder of the FTP account}/ (set the FTP_DIR secret to choose another folder)"
          fi
          # Remove the copy the old builds left in public_html/bingo/bingo (preotkrivanegk.com/bingo/bingo/)
          if [ -z "$DIR" ] && echo "$LIST" | grep -qx "bingo"; then
            curl --silent --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" \
              -Q "DELE bingo/index.html" -Q "DELE bingo/bingo-push-sw.js" -Q "RMD bingo" "ftp://$HOST/" > /dev/null \
              && echo "Removed the old nested bingo/ folder" || echo "::notice::Could not remove the old nested bingo/ folder (remove public_html/bingo/bingo in cPanel)"
          fi
          URL="ftp://$HOST/${DIR:+$DIR/}index.html"
          # FTPS (encrypted); the folder is created if it doesn't exist yet
          curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs --retry 3 \
            --user "$FTP_USER:$FTP_PASSWORD" -T dist/web/index.html "$URL"
          # the push service worker for Messages must sit next to the page
          curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs --retry 3 \
            --user "$FTP_USER:$FTP_PASSWORD" -T dist/web/bingo-push-sw.js "ftp://$HOST/${DIR:+$DIR/}bingo-push-sw.js"
          echo "Uploaded BingO ${{ steps.ver.outputs.version }} to $HOST/${DIR:+$DIR/}index.html"

      - name: Remove signing key
        if: always()
        run: rm -rf platforms/android/signing
